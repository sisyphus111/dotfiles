"$schema" = "https://starship.rs/config-schema.json"

# Keep the prompt informative without Powerline-style background blocks.
add_newline = false
format = "$conda$username$hostname$directory$git_branch$git_status$line_break$character"
palette = "blue_velvet_tokyo_night"

[palettes.blue_velvet_tokyo_night]
tokyo_teal = "#73daca"
tokyo_blue = "#7aa2f7"
tokyo_cyan = "#7dcfff"
tokyo_purple = "#bb9af7"
velvet_blue = "#199ffd"
velvet_green = "#37bd58"
velvet_yellow = "#f6be48"
velvet_red = "#fc4a6d"
velvet_cyan = "#50acae"

[conda]
format = '[\($environment\)]($style) '
style = "bold tokyo_teal"
ignore_base = false

[username]
show_always = true
style_user = "bold tokyo_blue"
style_root = "bold velvet_red"
format = "[$user]($style)"

[hostname]
ssh_only = false
trim_at = ""
style = "bold tokyo_purple"
format = "[@$hostname]($style) "

[directory]
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
style = "bold tokyo_cyan"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold tokyo_purple"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold velvet_blue"
conflicted = '[=${count}](bold velvet_red)'
ahead = '[⇡${count}](bold velvet_green)'
behind = '[⇣${count}](bold velvet_red)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](bold tokyo_purple)'
untracked = '[?${count}](bold velvet_yellow)'
stashed = '[\$${count}](bold tokyo_purple)'
modified = '[!${count}](bold velvet_blue)'
staged = '[+${count}](bold velvet_green)'
renamed = '[»${count}](bold velvet_cyan)'
deleted = '[✘${count}](bold velvet_red)'

[character]
success_symbol = "[❯](bold tokyo_teal)"
error_symbol = "[❯](bold velvet_red)"
vimcmd_symbol = "[❮](bold tokyo_teal)"
